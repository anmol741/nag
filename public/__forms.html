<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Netlify Forms Detection</title>
  </head>
  <body id="netlify-forms-endpoint">
    <!--
      Static-detection file for Netlify Forms, per the official Next.js/
      OpenNext guidance: https://opennext.js.org/netlify/forms

      Modern Next.js doesn't emit one static HTML file per route, so
      Netlify's deploy-time form crawler can't see forms rendered only by
      React components (especially ones on dynamically-rendered routes,
      e.g. /enroll). This file exists purely so that crawler can detect
      each form below as static HTML at build time — noindex above keeps it
      out of search results.

      It is ALSO the live runtime submission target: the React forms POST
      here directly (see lib/netlify-forms.ts), not to "/". "/" is a real
      Next.js app route, so a POST there gets a normal 200 response from
      the homepage instead of being intercepted by Netlify's forms proxy —
      confirmed by request logging showing submissions never reached
      Netlify Forms even though the fetch "succeeded". This file has no app
      route behind it, so Netlify's proxy can actually intercept the POST.

      The `id="netlify-forms-endpoint"` on <body> is a marker
      lib/netlify-forms.ts checks for in the response text, so a misrouted
      submission that still returns some 200 HTML page can't be mistaken
      for success. Keep every field name in sync with the corresponding
      component's submit handler.
    -->

    <!-- components/ContactForm.tsx, rendered on /contact -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" />
      <input name="phone" type="text" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>

    <!-- components/EnrollForm.tsx, rendered on /enroll -->
    <form name="enrollment" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="enrollment" />
      <input name="bot-field" type="text" />
      <input name="firstName" type="text" />
      <input name="lastName" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="text" />
      <input name="courseSlug" type="text" />
      <input name="courseName" type="text" />
      <input name="coursePrice" type="text" />
      <textarea name="message"></textarea>
      <input name="consent" type="text" />
    </form>

    <!-- components/SignupForm.tsx, rendered on /newsletter -->
    <form name="newsletter-course-updates" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter-course-updates" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" />
      <input name="phone" type="text" />
      <input name="email" type="email" />
      <input name="interest" type="text" />
      <textarea name="notes"></textarea>
    </form>

    <!-- components/NewsletterForm.tsx, rendered in the footer on every page -->
    <form name="footer-newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="footer-newsletter" />
      <input name="bot-field" type="text" />
      <input name="email" type="email" />
    </form>
  </body>
</html>
